version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: volta_db
    environment:
      POSTGRES_DB: volta
      POSTGRES_USER: volta_user
      POSTGRES_PASSWORD: volta_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U volta_user -d volta"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (Cache + Result Backend)
  redis:
    image: redis:7-alpine
    container_name: volta_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ (Message Broker)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: volta_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: volta
      RABBITMQ_DEFAULT_PASS: volta_password
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django Web Application
  web:
    build: ./backend
    container_name: volta_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
      - media_files:/app/media
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://volta_user:volta_password@db:5432/volta
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=amqp://volta:volta_password@rabbitmq:5672//

  # Celery Worker - Optimized for large CSV processing
  celery_worker:
    build: ./backend
    container_name: volta_celery_worker
    command: sh -c "celery -A volta worker --loglevel=info --concurrency=$${CELERY_WORKER_CONCURRENCY:-2} --prefetch-multiplier=$${CELERY_WORKER_PREFETCH_MULTIPLIER:-1}"
    volumes:
      - ./backend:/app
      - media_files:/app/media
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://volta_user:volta_password@db:5432/volta
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=amqp://volta:volta_password@rabbitmq:5672//
      - CELERY_WORKER_CONCURRENCY=${CELERY_WORKER_CONCURRENCY:-2}
      - CELERY_WORKER_PREFETCH_MULTIPLIER=${CELERY_WORKER_PREFETCH_MULTIPLIER:-1}

  # Celery Beat (Optional - for scheduled tasks)
  celery_beat:
    build: ./backend
    container_name: volta_celery_beat
    command: celery -A volta beat --loglevel=info
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://volta_user:volta_password@db:5432/volta
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=amqp://volta:volta_password@rabbitmq:5672//

  # React Frontend (Development mode with hot-reload)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: volta_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:5173"
    depends_on:
      - web
    environment:
      - VITE_API_URL=/api

volumes:
  postgres_data:
  media_files:
