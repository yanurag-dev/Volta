name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allow manual trigger

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  IMAGE_PREFIX: ${{ secrets.DOCKER_USERNAME }}/volta

jobs:
  # Run tests before deployment
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: volta_test
          POSTGRES_USER: volta_user
          POSTGRES_PASSWORD: volta_password
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

      rabbitmq:
        image: rabbitmq:3-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: volta
          RABBITMQ_DEFAULT_PASS: volta_password
        ports:
          - 5672:5672
        options: --health-cmd "rabbitmq-diagnostics ping" --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      DATABASE_URL: postgresql://volta_user:volta_password@localhost:5432/volta_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: amqp://volta:volta_password@localhost:5672//
      SECRET_KEY: test-secret-key-for-ci
      DEBUG: 'False'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          cd backend
          pip install -r requirements.txt

      - name: Run migrations
        run: |
          cd backend
          python manage.py migrate

      - name: Run tests
        run: |
          cd backend
          python manage.py test

      - name: Lint backend
        run: |
          pip install flake8
          cd backend
          flake8 volta/ --count --show-source --statistics || true

  # Frontend tests and lint
  frontend-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint frontend
        run: |
          cd frontend
          npm run lint || true

      - name: Build frontend
        run: |
          cd frontend
          npm run build

  # Build and push Docker images to Docker Hub
  build-and-push:
    needs: [test, frontend-test]
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels)
        id: meta
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "image_tag=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "date=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-backend:${{ steps.meta.outputs.image_tag }}
            ${{ env.IMAGE_PREFIX }}-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=/api
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:${{ steps.meta.outputs.image_tag }}
            ${{ env.IMAGE_PREFIX }}-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Build and push Nginx image
        uses: docker/build-push-action@v5
        with:
          context: ./nginx
          file: ./nginx/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-nginx:${{ steps.meta.outputs.image_tag }}
            ${{ env.IMAGE_PREFIX }}-nginx:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Image summary
        run: |
          echo "✅ Images pushed to Docker Hub:"
          echo "Backend:  ${{ env.IMAGE_PREFIX }}-backend:${{ steps.meta.outputs.image_tag }}"
          echo "Frontend: ${{ env.IMAGE_PREFIX }}-frontend:${{ steps.meta.outputs.image_tag }}"
          echo "Nginx:    ${{ env.IMAGE_PREFIX }}-nginx:${{ steps.meta.outputs.image_tag }}"

  # Deploy to EC2
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          envs: DOCKER_USERNAME,IMAGE_TAG
          script: |
            set -e

            echo "🚀 Starting deployment..."
            echo "Image tag: $IMAGE_TAG"

            # Navigate to application directory
            cd /home/${{ secrets.EC2_USERNAME }}/volta

            # Pull latest code from main branch
            git fetch origin
            git checkout main
            git pull origin main

            # Export environment variables for docker-compose
            export DOCKER_USERNAME=$DOCKER_USERNAME
            export IMAGE_TAG=$IMAGE_TAG

            # Pull new images from Docker Hub
            echo "📥 Pulling Docker images from Docker Hub..."
            docker-compose -f docker-compose.deploy.yml pull

            # Run deployment script
            echo "🔄 Running deployment..."
            bash deploy/scripts/deploy.sh

            # Verify deployment
            echo "✅ Verifying deployment..."
            docker-compose -f docker-compose.deploy.yml ps

            echo "🎉 Deployment completed successfully!"

      - name: Deployment notification
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ Deployment to production successful!"
            echo "Image tag: ${{ needs.build-and-push.outputs.image_tag }}"
            echo "Deployed at: $(date)"
          else
            echo "❌ Deployment failed!"
          fi

  # Rollback job (manual trigger only)
  rollback:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: production-rollback

    steps:
      - uses: actions/checkout@v4

      - name: Rollback to previous version
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script: |
            cd /home/${{ secrets.EC2_USERNAME }}/volta
            bash deploy/scripts/rollback.sh
