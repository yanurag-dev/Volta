name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  # Backend CI: Lint and Test
  backend-ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: volta_test
          POSTGRES_USER: volta_user
          POSTGRES_PASSWORD: volta_password
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

      rabbitmq:
        image: rabbitmq:3-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: volta
          RABBITMQ_DEFAULT_PASS: volta_password
        ports:
          - 5672:5672
        options: --health-cmd "rabbitmq-diagnostics ping" --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      DATABASE_URL: postgresql://volta_user:volta_password@localhost:5432/volta_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: amqp://volta:volta_password@localhost:5672//
      SECRET_KEY: test-secret-key-for-ci
      DEBUG: 'False'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          cd backend
          pip install -r requirements.txt

      - name: Run migrations
        run: |
          cd backend
          python manage.py migrate

      - name: Run tests
        run: |
          cd backend
          python manage.py test

      - name: Lint backend
        run: |
          pip install flake8
          cd backend
          flake8 volta/ --exclude=migrations,__pycache__ --max-line-length=100 --extend-ignore=E501,W503 --count --show-source --statistics

  # Frontend CI: Lint and Test
  frontend-ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint frontend
        run: |
          cd frontend
          npm run lint

      - name: Run frontend tests (if available)
        run: |
          cd frontend
          npm test -- --run || echo "No tests configured"
        continue-on-error: true

  # Backend CD: Build Docker Image
  backend-build:
    needs: backend-ci
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: volta-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Backend build summary
        run: |
          echo "✅ Backend Docker image built successfully!"
          echo "Image: volta-backend:latest"
          echo "Build date: $(date)"

  # Frontend CD: Build Docker Image
  frontend-build:
    needs: frontend-ci
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend Docker image (Production)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: false
          build-args: |
            VITE_API_URL=/api
          tags: volta-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Frontend build summary
        run: |
          echo "✅ Frontend Docker image built successfully!"
          echo "Image: volta-frontend:latest"
          echo "Build date: $(date)"
