version: '3.8'

# Lightweight Docker Compose for AWS EC2 (t2.micro)
# Uses managed services: RDS PostgreSQL, ElastiCache Redis, CloudAMQP RabbitMQ
# Only runs: Django, Celery, Frontend, Nginx

services:
  # Django Web Application
  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: volta_web
    command: gunicorn volta.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 2 --timeout 120 --max-requests 1000 --max-requests-jitter 50
    volumes:
      - media_files:/app/media
      - static_files:/app/staticfiles
    expose:
      - "8000"
    env_file:
      - ./backend/.env.production
    restart: unless-stopped
    networks:
      - volta_network
    deploy:
      resources:
        limits:
          memory: 400M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/admin/login/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Celery Worker
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: volta_celery_worker
    command: celery -A volta worker --loglevel=info --concurrency=2 --max-tasks-per-child=50 --max-memory-per-child=200000
    volumes:
      - media_files:/app/media
    env_file:
      - ./backend/.env.production
    restart: unless-stopped
    networks:
      - volta_network
    deploy:
      resources:
        limits:
          memory: 400M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "celery -A volta inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: volta_frontend
    expose:
      - "80"
    restart: unless-stopped
    networks:
      - volta_network
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: volta_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/usr/share/nginx/html/static:ro
      - media_files:/usr/share/nginx/html/media:ro
    depends_on:
      - web
      - frontend
    restart: unless-stopped
    networks:
      - volta_network
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  media_files:
    driver: local
  static_files:
    driver: local

networks:
  volta_network:
    driver: bridge
